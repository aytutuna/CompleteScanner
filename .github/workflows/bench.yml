name: Page detector bench

# The iPhone's page detectors side by side on the SmartDoc 2015 Challenge 1 frames
# (jchazalon/smartdoc15-ch1-dataset v2.0.0, CC BY 4.0): DocAlignerBenchTests on the iOS Simulator
# (FastViT-T8, Built-in and the Simulator's Vision), with the model's test on the page photos, then
# Vision on the Mac itself. Run it by hand from the Actions tab, or push to ci/bench. The table is
# the docaligner-bench artifact and the run's summary.
on:
  workflow_dispatch:
  push:
    branches: [ci/bench]

permissions:
  contents: read

jobs:
  bench:
    # The same image, Xcode and simulator choice as the ios job in ci.yml.
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Fetch the corner model
        run: bash scripts/fetch_docaligner.sh
      - name: Pick the simulator
        id: simulator
        env:
          IOS_RUNTIME: '26.5'
          IOS_DEVICE: iPhone 17
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - "$RUNNER_TEMP/simulators.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, sys
          devices = json.load(open(sys.argv[1]))["devices"]
          wanted_runtime = tuple(int(part) for part in os.environ["IOS_RUNTIME"].split("."))
          wanted_device = os.environ["IOS_DEVICE"]
          phones = []
          for runtime, entries in devices.items():
              if ".SimRuntime.iOS-" not in runtime:
                  continue
              version = tuple(int(part) for part in runtime.rsplit("iOS-", 1)[1].split("-"))
              for entry in entries:
                  if entry.get("isAvailable", False) and entry["name"].startswith("iPhone"):
                      phones.append((version, entry["name"], entry["udid"]))
          if not phones:
              sys.exit("No available iPhone simulator on this image.")
          exact = [p for p in phones if p[0] == wanted_runtime and p[1] == wanted_device]
          newest = max(p[0] for p in phones)
          chosen = exact[0] if exact else sorted(p for p in phones if p[0] == newest)[0]
          print("Simulator: %s, iOS %s, %s" % (chosen[1], ".".join(str(n) for n in chosen[0]), chosen[2]), file=sys.stderr)
          print("udid=%s" % chosen[2])
          PY
      # The frames (about 1 GB) with their metadata, checked against the SHA-256 pinned here and the one the
      # release lists; metadata.csv.gz is unpacked for the test, which reads plain CSV.
      - name: Fetch the SmartDoc frames
        id: frames
        env:
          SMARTDOC_RELEASE: https://github.com/jchazalon/smartdoc15-ch1-dataset/releases/download/v2.0.0
          FRAMES_SHA256: 3acb8be143fc86c507d90d298097cba762e91a3abf7e2d35ccd5303e13a79eae
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o frames.tar.gz "$SMARTDOC_RELEASE/frames.tar.gz"
          curl -fsSL -o sha256.chksum "$SMARTDOC_RELEASE/sha256.chksum"
          listed=$(awk '$2 == "frames.tar.gz" { print $1 }' sha256.chksum)
          hash=$(shasum -a 256 frames.tar.gz | cut -d ' ' -f 1)
          if [ "$hash" != "$FRAMES_SHA256" ] || [ "$listed" != "$FRAMES_SHA256" ]; then
            echo "SmartDoc frames checksum mismatch: $hash (release lists $listed)"
            exit 1
          fi
          mkdir -p smartdoc
          tar -xzf frames.tar.gz -C smartdoc
          rm frames.tar.gz
          meta=$(find smartdoc -name metadata.csv.gz -print -quit)
          if [ -z "$meta" ]; then
            echo "No metadata.csv.gz in the frames"
            exit 1
          fi
          gunzip -kf "$meta"
          echo "folder=$RUNNER_TEMP/$(dirname "$meta")" >> "$GITHUB_OUTPUT"
      # Optimized with testability on, as the ios job's tests. TEST_RUNNER_ variables reach the tests
      # without the prefix.
      - name: Run the bench
        env:
          TEST_RUNNER_SMARTDOC_FRAMES: ${{ steps.frames.outputs.folder }}
          TEST_RUNNER_SMARTDOC_STEP: '25'
          TEST_RUNNER_BENCH_OUT: ${{ runner.temp }}/bench
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme LazyScan-Package \
            -configuration Release \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -only-testing:LazyScanIOSTests/DocAlignerBenchTests \
            -only-testing:LazyScanModelTests/FastViTCornerModelTests \
            -resultBundlePath "$RUNNER_TEMP/bench.xcresult" \
            ENABLE_TESTABILITY=YES \
            CODE_SIGNING_ALLOWED=NO
      # Vision on the Mac itself: the Simulator's gives junk. Appends its rows to the same table.
      - name: Run Vision on the Mac
        if: always()
        run: swift scripts/bench_vision.swift "${{ steps.frames.outputs.folder }}" 25 "$RUNNER_TEMP/bench/bench.md"
      - name: Add the table to the summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/bench/bench.md" ]; then
            cat "$RUNNER_TEMP/bench/bench.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No bench.md was written" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload the table
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docaligner-bench
          path: ${{ runner.temp }}/bench/bench.md
          if-no-files-found: warn
      - name: Upload the test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: bench-xcresult
          path: ${{ runner.temp }}/bench.xcresult
          if-no-files-found: ignore
