name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test windows/CompleteScanner.sln -c Release

  macos:
    # Package.swift declares swift-tools-version 5.9 and macOS 14. The macos-15 image
    # ships Xcode 16.0 through 26.x with 16.4 (Swift 6.1) as its default; select 16.4
    # explicitly so a change of the image's default Xcode cannot change the toolchain
    # silently. Source: actions/runner-images, images/macos/macos-15-arm64-Readme.md.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
