name: CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # The 32-bit TWAIN helper (windows/CompleteScanner.TwainHelper, x86) runs on the 32-bit .NET
      # runtime, which its tests start for real. Installed with Microsoft's dotnet-install script
      # into the default x86 location, where the helper's host looks, unless the image has it.
      - name: Install the 32-bit .NET Desktop Runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path ${env:ProgramFiles(x86)} 'dotnet'
          if (-not (Test-Path (Join-Path $root 'shared\Microsoft.WindowsDesktop.App\10.*'))) {
            $script = Join-Path $env:RUNNER_TEMP 'dotnet-install.ps1'
            Invoke-WebRequest 'https://dot.net/v1/dotnet-install.ps1' -OutFile $script
            & $script -Channel 10.0 -Runtime dotnet -Architecture x86 -InstallDir $root -NoPath
            & $script -Channel 10.0 -Runtime windowsdesktop -Architecture x86 -InstallDir $root -NoPath
          }
          Get-ChildItem (Join-Path $root 'shared\Microsoft.WindowsDesktop.App') | Select-Object -ExpandProperty Name
      # WIA's tests ask the real WIA Automation (COMPLETESCANNER_REQUIRE_WIA below). The image's
      # Windows Image Acquisition service (stisvc) is left stopped if it is: asking WIA starts it,
      # as the app relies on. Only a disabled one is set to Manual, so it can be started that way.
      - name: Show the WIA service
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $service = Get-Service stisvc
          "stisvc: $($service.Status), start type $($service.StartType)"
          if ($service.StartType -eq 'Disabled') {
            Set-Service stisvc -StartupType Manual
            "stisvc: start type set to $((Get-Service stisvc).StartType)"
          }
      # Built first, so the tests do not share the runner's cores with the compiler.
      - name: Build
        run: dotnet build windows/CompleteScanner.sln -c Release
      - name: Test
        run: dotnet test windows/CompleteScanner.sln -c Release --no-build
        env:
          # The helper's tests must run here, never be skipped for a missing runtime.
          COMPLETESCANNER_REQUIRE_TWAIN_HELPER: '1'
          # PdfATests.Archival_ValidationSamples keeps the PDF/A files it writes here, for veraPDF.
          COMPLETESCANNER_PDFA_SAMPLES: ${{ runner.temp }}\pdfa-samples
          # The phone link's certificate test uses a certificate store of its own; on the runner only.
          COMPLETESCANNER_CERT_STORE_TESTS: '1'
          # WIA's tests must ask the real WIA here, never be skipped.
          COMPLETESCANNER_REQUIRE_WIA: '1'
      - name: Show the WIA service after the tests
        if: always()
        shell: pwsh
        run: |
          $service = Get-Service stisvc
          "stisvc: $($service.Status), start type $($service.StartType)"
      # veraPDF, the PDF/A validator (MPL-2.0 / GPL-3.0), checks those files. It is downloaded here
      # only, pinned to one release and its SHA-256, and never shipped. Its official Docker image is
      # Linux-only, and there is no official action, so the CLI is installed from its release
      # installer the way that image's Dockerfile does it (veraPDF-apps, docker-install.xml).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate PDF/A samples (veraPDF)
        shell: pwsh
        env:
          VERAPDF_VERSION: 1.30.3
          VERAPDF_SHA256: B512BF24945503A33FC10738ECFFC1F2DCCAAF8593A448E94EE9AC86A9559A59
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:VERAPDF_VERSION
          $series = $version.Substring(0, $version.LastIndexOf('.'))
          $zip = Join-Path $env:RUNNER_TEMP 'verapdf-installer.zip'
          Invoke-WebRequest "https://software.verapdf.org/releases/$series/verapdf-greenfield-$version-installer.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($hash -ne $env:VERAPDF_SHA256) { throw "veraPDF installer checksum mismatch: $hash" }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          $target = Join-Path $env:RUNNER_TEMP 'verapdf'
          $config = Join-Path $env:RUNNER_TEMP 'verapdf-install.xml'
          @"
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <AutomatedInstallation langpack="eng">
              <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
              <com.izforge.izpack.panels.target.TargetPanel id="install_dir">
                  <installpath>$target</installpath>
              </com.izforge.izpack.panels.target.TargetPanel>
              <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">
                  <pack index="0" name="veraPDF GUI" selected="false"/>
                  <pack index="1" name="veraPDF CLI" selected="true"/>
                  <pack index="2" name="veraPDF Documentation" selected="false"/>
                  <pack index="3" name="veraPDF Sample Plugins" selected="false"/>
              </com.izforge.izpack.panels.packs.PacksPanel>
              <com.izforge.izpack.panels.install.InstallPanel id="install"/>
              <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>
          </AutomatedInstallation>
          "@ | Set-Content -Path $config -Encoding utf8
          java -jar (Join-Path $env:RUNNER_TEMP "verapdf-greenfield-$version\verapdf-izpack-installer-$version.jar") $config
          if ($LASTEXITCODE -ne 0) { throw "veraPDF did not install (exit code $LASTEXITCODE)" }
          $samples = @(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'pdfa-samples') -Filter *.pdf)
          if ($samples.Count -lt 2) { throw "Expected the tests' PDF/A samples, found $($samples.Count)" }
          # Machine-readable report: one validationReport per file, isCompliant="true" when it passes.
          $report = & (Join-Path $target 'verapdf.bat') --flavour 2b --format mrr $samples.FullName
          $code = $LASTEXITCODE
          $text = $report -join "`n"
          Write-Output $text
          $passed = [regex]::Matches($text, '<validationReport\b[^>]*\bisCompliant="true"').Count
          if ($code -ne 0 -or $passed -ne $samples.Count) {
            throw "veraPDF: exit code $code, $passed of $($samples.Count) files are PDF/A-2b"
          }
          Write-Output "veraPDF $version`: all $passed samples are PDF/A-2b."

  macos:
    # Package.swift declares swift-tools-version 6.0 (the Swift 5 language mode), macOS 14 and
    # iOS 18. The macos-15 image ships Xcode 16.0 through 26.x with 16.4 (Swift 6.1) as its
    # default; select 16.4 explicitly so a change of the image's default Xcode cannot change the
    # toolchain silently. Source: actions/runner-images, images/macos/macos-15-arm64-Readme.md.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Toolchain
        run: swift --version
      # The app as developers build it (debug).
      - name: Build
        run: swift build
      # The tests run optimized: the image, PDF and OCR code they drive takes many times longer in
      # a debug build (over 40 minutes). -enable-testing keeps @testable imports working in it, and
      # --parallel runs the test classes in several processes at once.
      - name: Test
        run: swift test -c release -Xswiftc -enable-testing --parallel
        env:
          # PDFATests.test_archival_validationSamples keeps the PDF/A files the Swift writer makes here,
          # for veraPDF below.
          COMPLETESCANNER_PDFA_SAMPLES: ${{ runner.temp }}/pdfa-samples
      # The same pinned veraPDF as the Windows job checks the Swift writer's PDF/A files. It is
      # downloaded here only, pinned to one release and its SHA-256, and never shipped; installed from
      # its release installer the way the official Docker image's Dockerfile does it.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate PDF/A samples (veraPDF)
        env:
          VERAPDF_VERSION: 1.30.3
          VERAPDF_SHA256: B512BF24945503A33FC10738ECFFC1F2DCCAAF8593A448E94EE9AC86A9559A59
        run: |
          set -euo pipefail
          version="$VERAPDF_VERSION"
          series="${version%.*}"
          zip="$RUNNER_TEMP/verapdf-installer.zip"
          curl -fsSL -o "$zip" "https://software.verapdf.org/releases/$series/verapdf-greenfield-$version-installer.zip"
          hash=$(shasum -a 256 "$zip" | cut -d ' ' -f 1 | tr '[:lower:]' '[:upper:]')
          if [ "$hash" != "$VERAPDF_SHA256" ]; then
            echo "veraPDF installer checksum mismatch: $hash"
            exit 1
          fi
          unzip -q "$zip" -d "$RUNNER_TEMP"
          target="$RUNNER_TEMP/verapdf"
          config="$RUNNER_TEMP/verapdf-install.xml"
          cat > "$config" <<XML
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <AutomatedInstallation langpack="eng">
              <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
              <com.izforge.izpack.panels.target.TargetPanel id="install_dir">
                  <installpath>$target</installpath>
              </com.izforge.izpack.panels.target.TargetPanel>
              <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">
                  <pack index="0" name="veraPDF GUI" selected="false"/>
                  <pack index="1" name="veraPDF CLI" selected="true"/>
                  <pack index="2" name="veraPDF Documentation" selected="false"/>
                  <pack index="3" name="veraPDF Sample Plugins" selected="false"/>
              </com.izforge.izpack.panels.packs.PacksPanel>
              <com.izforge.izpack.panels.install.InstallPanel id="install"/>
              <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>
          </AutomatedInstallation>
          XML
          java -jar "$RUNNER_TEMP/verapdf-greenfield-$version/verapdf-izpack-installer-$version.jar" "$config"
          shopt -s nullglob
          samples=("$RUNNER_TEMP"/pdfa-samples/*.pdf)
          if [ "${#samples[@]}" -lt 3 ]; then
            echo "Expected the Swift tests' PDF/A samples, found ${#samples[@]}"
            exit 1
          fi
          # Machine-readable report: one validationReport per file, isCompliant="true" when it passes.
          set +e
          report=$("$target/verapdf" --flavour 2b --format mrr "${samples[@]}")
          code=$?
          set -e
          echo "$report"
          passed=$( (printf '%s' "$report" | grep -o '<validationReport[^>]*isCompliant="true"' || true) | wc -l | tr -d ' ')
          if [ "$code" -ne 0 ] || [ "$passed" -ne "${#samples[@]}" ]; then
            echo "veraPDF: exit code $code, $passed of ${#samples[@]} files are PDF/A-2b"
            exit 1
          fi
          echo "veraPDF $version: all $passed samples from the Swift writer are PDF/A-2b."

  ios:
    # The shared Swift suite (CompleteScannerKit's tests) and the iPhone's own tests on the iOS
    # Simulator, once the macOS job is green. The macos-26 image (arm64; image 20261013) ships Xcode
    # 26.0.1 through 26.6 with 26.6 as its default, and iOS Simulator runtimes 26.2, 26.4 and 26.5;
    # select 26.6 explicitly so a change of the image's default Xcode cannot change the toolchain
    # silently. Source: actions/runner-images, images/macos/macos-26-arm64-Readme.md.
    needs: macos
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      # DocAligner's corner models for the iPhone's page detector test, into the package's Models
      # folder before anything builds it (pinned release, SHA-256 checked by the script). The macOS job
      # builds without them.
      - name: Fetch DocAligner's models
        run: bash scripts/fetch_docaligner.sh
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Simulator runtimes
        run: xcrun simctl list runtimes
      - name: Schemes
        run: xcodebuild -list
      # The iPhone 17 on the iOS 26.5 runtime when the image has it; otherwise the newest iOS
      # runtime's iPhone, so a change of the image's simulators does not stop the job.
      - name: Pick the simulator
        id: simulator
        env:
          IOS_RUNTIME: '26.5'
          IOS_DEVICE: iPhone 17
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - "$RUNNER_TEMP/simulators.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, sys
          devices = json.load(open(sys.argv[1]))["devices"]
          wanted_runtime = tuple(int(part) for part in os.environ["IOS_RUNTIME"].split("."))
          wanted_device = os.environ["IOS_DEVICE"]
          phones = []
          for runtime, entries in devices.items():
              if ".SimRuntime.iOS-" not in runtime:
                  continue
              version = tuple(int(part) for part in runtime.rsplit("iOS-", 1)[1].split("-"))
              for entry in entries:
                  if entry.get("isAvailable", False) and entry["name"].startswith("iPhone"):
                      phones.append((version, entry["name"], entry["udid"]))
          if not phones:
              sys.exit("No available iPhone simulator on this image.")
          exact = [p for p in phones if p[0] == wanted_runtime and p[1] == wanted_device]
          newest = max(p[0] for p in phones)
          chosen = exact[0] if exact else sorted(p for p in phones if p[0] == newest)[0]
          print("Simulator: %s, iOS %s, %s" % (chosen[1], ".".join(str(n) for n in chosen[0]), chosen[2]), file=sys.stderr)
          print("udid=%s" % chosen[2])
          PY
      # Optimized, as the macOS job's tests are (a debug build takes many times longer), with
      # testability on for the tests' @testable imports. The result bundle is kept for a failure.
      # The shared suite includes the protected PDFs' round trip through PDFKit (PDFEncryptionTests:
      # PDFDocument.unlock with the user's and the owner password), so it runs here as on the Mac.
      - name: Test on the iOS Simulator
        run: |
          set -o pipefail
          xcodebuild test             -scheme CompleteScanner-Package             -configuration Release             -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}"             -resultBundlePath "$RUNNER_TEMP/ios-tests.xcresult"             ENABLE_TESTABILITY=YES             CODE_SIGNING_ALLOWED=NO
      # XcodeGen (MIT) writes the iPhone and iPad app's Xcode project from ios/project.yml. It is
      # downloaded here only, pinned to one release and its SHA-256 (the release's xcodegen.zip, a
      # universal macOS binary with its setting presets), and never shipped; the project it writes is
      # not checked in. Source: github.com/yonaskolb/XcodeGen/releases/tag/2.46.0.
      - name: Install XcodeGen
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/xcodegen.zip"
          curl -fsSL -o "$zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          hash=$(shasum -a 256 "$zip" | cut -d ' ' -f 1)
          if [ "$hash" != "$XCODEGEN_SHA256" ]; then
            echo "XcodeGen checksum mismatch: $hash"
            exit 1
          fi
          unzip -q "$zip" -d "$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION"
          echo "$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Write the app's project
        run: |
          xcodegen --version
          xcodegen generate --spec ios/project.yml
      # The app and its UI smoke test, built once for the simulator picked above (optimized, as the
      # package's tests are; unsigned, which the Simulator allows), then run without building again.
      - name: Build the app for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project ios/CompleteScanneriOS.xcodeproj \
            -scheme CompleteScanneriOS \
            -configuration Release \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/app-build" \
            CODE_SIGNING_ALLOWED=NO
      - name: Run the app's smoke test
        timeout-minutes: 30
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project ios/CompleteScanneriOS.xcodeproj \
            -scheme CompleteScanneriOS \
            -configuration Release \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/app-build" \
            -resultBundlePath "$RUNNER_TEMP/ios-app-tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO
      # The screens ScreenshotTests keeps, renamed from the export's own file names to their attachment
      # names (01-camera.png, ...) through the manifest the export writes.
      - name: Export the screenshots
        if: always()
        run: |
          out="$RUNNER_TEMP/ios-screenshots"
          if [ ! -d "$RUNNER_TEMP/ios-app-tests.xcresult" ]; then
            echo "No app test results to export"
            exit 0
          fi
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/ios-app-tests.xcresult" \
            --output-path "$out"
          if [ -f "$out/manifest.json" ]; then
            python3 - "$out" <<'EOF'
          import json, os, re, sys
          out = sys.argv[1]
          with open(os.path.join(out, "manifest.json")) as f:
              tests = json.load(f)
          for test in tests:
              for attachment in test.get("attachments", []):
                  src = os.path.join(out, attachment.get("exportedFileName", ""))
                  name = attachment.get("suggestedHumanReadableName", "")
                  # The suggested name ends in "_<index>_<UUID>" before the extension.
                  name = re.sub(r"(_\d+)?_[0-9A-Fa-f-]{36}(?=\.\w+$)", "", name)
                  if not name or not src.endswith(".png") or not os.path.isfile(src):
                      continue
                  if not name.endswith(".png"):
                      name += ".png"
                  dst = os.path.join(out, name)
                  if not os.path.exists(dst):
                      os.rename(src, dst)
          EOF
          fi
          ls "$out"
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-screenshots
          path: ${{ runner.temp }}/ios-screenshots
          if-no-files-found: warn
      - name: Upload the test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-tests-xcresult
          path: |
            ${{ runner.temp }}/ios-tests.xcresult
            ${{ runner.temp }}/ios-app-tests.xcresult
          if-no-files-found: ignore
