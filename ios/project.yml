# The iPhone app's Xcode project, for XcodeGen (CI pins its release and SHA-256; see the
# ios job in .github/workflows/ci.yml). `xcodegen generate --spec ios/project.yml` writes
# ios/LazyScaniOS.xcodeproj, which is not checked in. The app target holds no logic: it starts
# LazyScanIOSApp from the package at the repository root (Sources/LazyScanIOS).
name: LazyScaniOS

options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"

packages:
  LazyScan:
    path: ..

targets:
  LazyScaniOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: LazyScaniOS
        excludes:
          - Info.plist
          - PrivacyInfo.xcprivacy
      - path: LazyScaniOS/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: LazyScan
        product: LazyScanIOS
    settings:
      base:
        PRODUCT_NAME: LazyScan
        PRODUCT_BUNDLE_IDENTIFIER: com.lazyscan.lazyscan
        INFOPLIST_FILE: LazyScaniOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # iPhone only for now: iPads run it in iPhone compatibility mode. Vision Pro has no camera
        # for camera mode, the root screen.
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  LazyScaniOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: LazyScaniOSUITests
        excludes:
          - Fixtures
          - Fixtures/**
      # The photos and PDFs the import, Photos, two-sided and batch tests bring in (drawn by
      # scripts/make_ios_ui_fixture.py).
      - path: LazyScaniOSUITests/Fixtures/document-photo.png
        buildPhase: resources
      - path: LazyScaniOSUITests/Fixtures/photos-on-table.png
        buildPhase: resources
      - path: LazyScaniOSUITests/Fixtures/two-sided.pdf
        buildPhase: resources
      - path: LazyScaniOSUITests/Fixtures/batch.pdf
        buildPhase: resources
    dependencies:
      - target: LazyScaniOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lazyscan.lazyscan.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: LazyScaniOS

schemes:
  LazyScaniOS:
    build:
      targets:
        LazyScaniOS: all
        LazyScaniOSUITests: [test]
    test:
      targets:
        - LazyScaniOSUITests
      gatherCoverageData: false
