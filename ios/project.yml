# The iPhone and iPad app's Xcode project, for XcodeGen (CI pins its release and SHA-256; see the
# ios job in .github/workflows/ci.yml). `xcodegen generate --spec ios/project.yml` writes
# ios/CompleteScanneriOS.xcodeproj, which is not checked in. The app target holds no logic: it starts
# CompleteScannerIOSApp from the package at the repository root (Sources/CompleteScannerIOS).
name: CompleteScanneriOS

options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"

packages:
  CompleteScanner:
    path: ..

targets:
  CompleteScanneriOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: CompleteScanneriOS
        excludes:
          - Info.plist
          - PrivacyInfo.xcprivacy
      - path: CompleteScanneriOS/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: CompleteScanner
        product: CompleteScannerIOS
    settings:
      base:
        PRODUCT_NAME: CompleteScanneriOS
        PRODUCT_BUNDLE_IDENTIFIER: com.completescanner.completescanner
        INFOPLIST_FILE: CompleteScanneriOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  CompleteScanneriOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: CompleteScanneriOSUITests
        excludes:
          - Fixtures
          - Fixtures/**
      # The photos and PDFs the import, Photos, two-sided and batch tests bring in (drawn by
      # scripts/make_ios_ui_fixture.py).
      - path: CompleteScanneriOSUITests/Fixtures/document-photo.png
        buildPhase: resources
      - path: CompleteScanneriOSUITests/Fixtures/photos-on-table.png
        buildPhase: resources
      - path: CompleteScanneriOSUITests/Fixtures/two-sided.pdf
        buildPhase: resources
      - path: CompleteScanneriOSUITests/Fixtures/batch.pdf
        buildPhase: resources
    dependencies:
      - target: CompleteScanneriOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.completescanner.completescanner.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: CompleteScanneriOS

schemes:
  CompleteScanneriOS:
    build:
      targets:
        CompleteScanneriOS: all
        CompleteScanneriOSUITests: [test]
    test:
      targets:
        - CompleteScanneriOSUITests
      gatherCoverageData: false
